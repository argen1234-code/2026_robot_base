// Keil debugger command functions: memory writes only, no target function calls.
// INCLUDE this file AFTER the user has approved wiring/power/limits.
// Definitions alone do not submit a command. Invoke each function explicitly.
// Limits are the existing g_motor_cmd values. PREPARE after editing limits.
FUNC void RS05_SUBMIT(unsigned int command, float target) {
  g_motor_cmd.seq = g_motor_cmd.seq | 1;
  g_motor_cmd.command = command;
  g_motor_cmd.confirm_key = 0x52533035;
  g_motor_cmd.target_rad_s = target;
  g_motor_cmd.seq = g_motor_cmd.seq + 1;
}
FUNC void RS05_PREPARE(void) { RS05_SUBMIT(1, 0.0); }
FUNC void RS05_ENABLE(void) { RS05_SUBMIT(2, 0.0); }
FUNC void RS05_RUN(float speed_rad_s) { RS05_SUBMIT(3, speed_rad_s); }
FUNC void RS05_STOP(void) { RS05_SUBMIT(4, 0.0); }
FUNC void RS05_DISABLE(void) { RS05_SUBMIT(5, 0.0); }
FUNC void RS05_CLEAR_FAULT(void) { RS05_SUBMIT(6, 0.0); }
FUNC void RS05_TEST_TIMEOUT(void) { RS05_SUBMIT(7, 0.0); }
