# =============================================================================
# laser_filters 滤波链配置
# =============================================================================
# 作用：订阅雷达原始数据 /scan，经滤波后发布 /scan_filtered。
#       RViz、slam_toolbox、rf2o_laser_odometry、Nav2 代价地图订阅的都是这一份。
#
# 节点 scan_to_scan_filter_chain 默认话题就是 scan -> scan_filtered，
# 在根命名空间下即 /scan -> /scan_filtered，无需重映射。
#
# ⚠️ 本配置必须传给【名字为 scan_to_scan_filter_chain】的节点：
#    下面的顶层 key 就是节点名，对不上参数不会被加载（表现为滤波无效）。
#
# ⚠️ 该节点还需要 TF —— 没有 TF 时它会打印 "Ignoring Scan: Waiting for TF"
#    并且不输出任何数据。
#
# ⚠️ 2026-11-05：雷达在 base_footprint 的 +X 端（约 +0.2225 m，离地 0.0862 m）。
#    laser_frame yaw 已从 -90° 修正为 +90°：
#      raw -90° → base_link 0°（车头）；raw +90° → base_link 180°（车尾，
#      自回波来自雷达后侧安装结构）。
#    新车自回波已实测，见下。
# =============================================================================
# 当前方案（2026-11-04 新两轮车实测后更新）：
#   0.20 ~ 10.0 m 距离截断 + 车尾后向盲区角度掩码。
#
#   新车自回波实测（/home/pi/rosbags/self_echo_new_20261104_233247，
#   22 s、222 帧、430 束/帧，整车静止）：
#     · 每帧 <0.10 m 的回波 56.1 束（39~71 束）；0.10~0.50 m 没有额外回波
#       —— 自回波全部落在 0.10 m 以内；
#     · 持续性自回波 23 束，raw 扫描角 +86.0°..+104.5°（经 TF 对应
#       base_link 车尾，不是车头），中位 0.087 m，最大 0.100 m；
#     · 车头方向 raw ≈ -90° 没有持续性近距离回波；
#       2026-11-05 速度测试中正前方箱体出现在 raw -105°，距离从
#       2.758 m 降到 1.439 m（Δ1.319 m），与前进 1.31 m 吻合。
#
#   2026-11-05 后向盲区掩码：
#     · raw +90° = base_link 车尾方向；实测自回波 +86.0°..+104.5°；
#     · 按 URDF 车体后向理论阴影 mask raw +66°..+114°（1.152..1.990 rad）；
#     · URDF 车体后向理论阴影约 raw +66°..+114°，但实测 0.1~0.5 m
#       没有车体回波，说明扫描平面高于车体，只掩实际自回波扇区。
#     · lower_threshold=0.20 对最大自回波有约 10 cm 余量。若想保留更近的
#       真实障碍，可降到 0.15 m（仍有 5 cm 余量），但不要低于 0.12 m。
# =============================================================================

scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: range
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.20
        upper_threshold: 10.0
        lower_replacement_value: .inf
        upper_replacement_value: .inf
    filter2:
      name: rear_blind
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        # raw laser_frame：+80°..+110°（base_link 车尾，窄掩码对照）
        lower_angle: 1.3962634
        upper_angle: 1.9198622
        replace_with_nan: true
        wrap_angle: true

# =============================================================================
# 其余滤波器为什么不启用
# =============================================================================
# 1) LaserScanFootprintFilter（车体剔除）—— 会让整条链断掉
#    实测：不写 inscribed_radius 时每帧报错
#        "We need an index channel to be able to filter out the footprint"
#    写 0.0 也同样报错，且 /scan_filtered 一帧都不输出。
#    必须给正数半径（例如 0.15）才正常；没有可用默认值，故不放默认方案。
#
# 2) ScanShadowsFilter / LaserScanSpeckleFilter
#    插件默认值接近空操作（Shadows 默认 min=max=90，启动会报参数错误），
#    需要调一堆数值才生效。静态场景下先保持链路干净；若实测有孤立噪点，
#    再按需加 speckle（filter_type 0，max_range_difference 0.1）。
