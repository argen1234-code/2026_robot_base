# =============================================================================
# laser_filters 滤波链配置
# =============================================================================
# 作用：订阅雷达原始数据 /scan，经角度滤波后发布 /scan_filtered。
#       RViz、slam_toolbox、rf2o_laser_odometry 订阅的都是过滤后的这一份。
#
# 节点 scan_to_scan_filter_chain 默认话题就是 scan -> scan_filtered，
# 在根命名空间下即 /scan -> /scan_filtered，无需重映射。
#
# ⚠️ 本配置必须传给【名字为 scan_to_scan_filter_chain】的节点：
#    下面的顶层 key 就是节点名，对不上参数不会被加载（表现为滤波无效）。
#
# ⚠️ 该节点还需要 TF —— 没有 TF 时它会打印 "Ignoring Scan: Waiting for TF"
#    并且不输出任何数据。单独调试时记得同时发一条 base_link -> laser_frame。
#
# =============================================================================
# 当前方案：屏蔽车尾 90°，保留以车头为中心的 270°。
# 雷达安装在车头，laser_frame 的 +Y（绿色轴）指向前方；LaserScan 的角度
# 以 laser_frame +X 为 0，因此车头方向为 +90°，车尾方向为 -90°。
# =============================================================================
# 曾经试过串联 5 级滤波（角度 + 距离 + 车体 + 阴影 + 散斑），已全部移除，
# 原因见文件末尾「为什么去掉了其余 4 个滤波器」。
# =============================================================================

scan_to_scan_filter_chain:
  ros__parameters:

    # -------------------------------------------------------------------------
    # 屏蔽车尾方向 ±45°（雷达坐标角 -135° 到 -45°），保留车头左右各 135°。
    # -------------------------------------------------------------------------
    # 使用 in-place 遮罩，保持整圈扫描及角度元数据不变；屏蔽束替换为
    # NaN。rf2o 只会忽略非有限值，不能用 range_max + 1（会被当作实测距离）。
    filter1:
      name: rear_sector
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: -2.35619449  # -135°，车尾扇区一侧边界
        upper_angle: -0.78539816  #  -45°，车尾扇区另一侧边界
        wrap_angle: false
        replace_with_nan: true

    # -------------------------------------------------------------------------
    # 2) 距离截断 —— ⚠️ 导航能否工作的关键，不要删
    # -------------------------------------------------------------------------
    # 上面的车尾遮罩挡不住【雷达自身的近距离回波】：实测 /scan_filtered 里
    # 仍有 19 个束在 0.1m 以内（最近 0.042m），是雷达扫到了自己的安装结构。
    #
    # 这些"假障碍"随点云进到 nav2 代价地图后，经 inflation_radius=0.50 膨胀，
    # 会把【机器人自己所处的格子】也标成致命：
    #     全局代价地图里 机器人位置代价 = 99（致命）
    #     -> 全局规划器起点即在障碍中 -> "Failed to create plan"
    #     -> RViz 里点了目标点车纹丝不动
    #
    # 阈值 0.20m：车身回波都 < 0.1m 全部落在其内；而机器人半径是 0.30m，
    # 任何 0.30m 以内的"障碍"本来就在车体内，对导航没有意义。
    # 被丢弃的束替换为 inf（非有限值），rf2o 与 nav2 都会忽略。
    filter2:
      name: range
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.20
        upper_threshold: 10.0
        lower_replacement_value: .inf
        upper_replacement_value: .inf

# =============================================================================
# 为什么去掉了其余 4 个滤波器
# =============================================================================
#
# 1) LaserScanFootprintFilter（车体剔除）—— ⚠️ 会让整条链断掉
#    实测：不写 inscribed_radius 时每帧报错
#        "We need an index channel to be able to filter out the footprint"
#    写 0.0 也同样报错。这两种情况下 /scan_filtered **一帧都不输出**
#    —— 不是"滤波不生效"，是整条链全断。
#    必须给一个正数半径（例如 0.15）才正常。既然它没有可用的默认值，
#    就不放在默认方案里。
#
# 2) LaserScanRangeFilter / ScanShadowsFilter / LaserScanSpeckleFilter
#    —— 插件默认值本身接近"空操作"：
#      Range     默认 0.0 ~ 100000.0  -> 不截断任何距离
#      Shadows   默认 min=max=90      -> 判定窗口极窄，实测启动时报
#                                      "max_angle must be 90 <= max_angle"
#    既然默认值等于不干活，又要在配置里写一堆数值才能起作用，
#    就先不启用，保持链路干净。

# =============================================================================
# 参考：想启用某项过滤时，把对应段落补回 ros__parameters 下即可
# =============================================================================
#
#   filter2:   # 距离截断 0.15~10m，超出置 inf
#     name: range
#     type: laser_filters/LaserScanRangeFilter
#     params:
#       use_message_range_limits: false
#       lower_threshold: 0.15
#       upper_threshold: 10.0
#       lower_replacement_value: .inf
#       upper_replacement_value: .inf
#
#   filter3:   # 车体剔除。⚠️ inscribed_radius 必须是正数，否则整条链断掉
#     name: footprint
#     type: laser_filters/LaserScanFootprintFilter
#     params:
#       inscribed_radius: 0.15
#
#   filter4:   # 去阴影虚点（对建图质量影响最大的一个）
#     name: shadows
#     type: laser_filters/ScanShadowsFilter
#     params:
#       min_angle: 10.0      # ⚠️ 这个插件用【角度】，上面 filter1 用【弧度】
#       max_angle: 170.0
#       neighbors: 2
#       window: 1
#       remove_shadow_start_point: true
#
#   filter5:   # 去孤立噪点
#     name: speckle
#     type: laser_filters/LaserScanSpeckleFilter
#     params:
#       filter_type: 0       # 0=按相邻点距离, 1=欧氏半径离群点搜索
#       max_range: 10.0
#       max_range_difference: 0.1
#       filter_window: 2
#
# 实测参考（5 项全启用、角度取 360° 时）：/scan 354 点/帧 -> 328 点/帧，滤掉约 7%
