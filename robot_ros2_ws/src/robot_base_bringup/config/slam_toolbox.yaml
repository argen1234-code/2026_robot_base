# =============================================================================
# slam_toolbox 参数 —— 标准异步建图模式
# =============================================================================
# 对应节点：async_slam_toolbox_node（见 robot_base.launch.py）
#
# 单雷达、无轮速反馈时默认采用成熟的 async 建图路径；环境变化时
# 保存地图后用定位模式导航，不依赖实验性的 lifelong 节点淘汰策略。
#
# 顶层 key 必须与 launch 里的节点名一致（都是 slam_toolbox），否则参数不加载。
#
# 坐标系（与 TF2 教程里的移动机器人树形图一致）：
#     map -> odom -> base_footprint -> base_link -> laser_frame
#       ▲      ▲            ▲
#       │      │            └─ URDF（robot_state_publisher）
#       │      └─ diff_drive_controller（controllers.yaml 的 base_frame_id）
#       └─ 本节点发布
#
# 输入：/scan_filtered（角度过滤后的雷达数据）+ TF
# 输出：/map、map->odom 的 TF
# =============================================================================

slam_toolbox:
  ros__parameters:

    # ---- 求解器（保持默认）----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---- 坐标系与话题 ----
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint      # ⚠️ 必须与 controllers.yaml 的 base_frame_id 一致
    scan_topic: /scan_filtered      # ⚠️ 用过滤后的，不是原始 /scan
    mode: mapping
    use_map_saver: true

    # ---- 跨重启继续建图（可选）----
    # 想让它重启后接着上次的地图继续（而不是从零开始），打开下面两项。
    # 文件由 /slam_toolbox/serialize_map 服务生成：
    #   ros2 service call /slam_toolbox/serialize_map \
    #       slam_toolbox/srv/SerializePoseGraph "{filename: /home/argen/map}"
    # 会得到 /home/argen/map.posegraph 与 /home/argen/map.data
    #
    # ⚠️ map_file_name 与 map_start_at_dock 互斥；给了 map_start_pose 则用 pose。
    #map_file_name: /home/argen/map
    #map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    # ---- 基本行为 ----
    debug_logging: false
    throttle_scans: 1               # 雷达只有 10Hz，不抽稀
    transform_publish_period: 0.02  # map->odom 的 TF 发布周期（50Hz）
    map_update_interval: 3.0        # /map 重算并发布的间隔（秒）
    resolution: 0.05                # 栅格 5cm
    restamp_tf: false
    min_laser_range: 0.0
    max_laser_range: 12.0           # ⚠️ 与 YDLIDAR Tmini Pro 量程一致
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # ---- 扫描匹配 ----
    use_scan_matching: true          # ⭐ 关掉就退化成纯里程计推算，必须为 true
    use_scan_barycenter: true

    # ---- 何时插入新节点 ----
    # 官方默认 0.5m/0.5rad 对小车偏粗，改 0.2 让位姿图更密
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ---- 回环检测 ----
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- 相关性搜索 ----
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---- 扫描匹配惩罚项 ----
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    # ⚠️ 已由默认值 2 改为 1。
    #
    # 含义：一个栅格要被【至少 N 条射线/扫描】穿过才标记为空闲。
    #
    # 默认值 2 是为【连续运动】场景调的。但实测（车静止 + 全新启动）：
    #   min_pass_through: 2  ->  占用 3 格,   空闲 766 格,  空闲区 2.1x4.6 m
    #   min_pass_through: 1  ->  占用 251 格, 空闲 3798 格, 空闲区 7.5x7.7 m
    # 即默认值下，单帧扫描几乎全被丢弃，RViz 里看着"只建了一帧、很小一块"，
    # 要等车走得足够多、扫描互相叠加后地图才长出来。
    #
    # 副作用：单条射线即可判定空闲，对噪声更敏感（可能产生虚假空闲区）。
    # 当前仅做车尾扇区遮罩，噪声环境下需实测评估虚假空闲区；
    # 若发现地图上出现"幽灵通道"，把这行改回 2。
    min_pass_through: 1
    occupancy_threshold: 0.1
