# JY901S 静止标定（2026-11-05，键盘测试基线）
# 语义：chassis_bridge 从原始角度/陀螺中【减去】这些值。
# 基线时小车水平静止：roll=+2.005°, pitch=-0.033°, yaw=218.260°，
# 陀螺零偏为 0（JY901S 内部已校准）。
#
# ⚠️ 13 s 连续行驶时 JY901S 融合 yaw 漂了约 97°，而 gyro_z 均值仅
#    -0.104°/s（积分约 -1.35°），雷达也显示车体直行。绝对 yaw 不可作为
#    航向使用；短时航向请用 gyro_z 积分或激光里程计。这里的 yaw 零偏
#    只用于把采集基线时的朝向显示为 0°。
chassis_bridge:
  ros__parameters:
    imu_roll_zero_deg: 2.0050048828125
    imu_pitch_zero_deg: -0.032958984375
    imu_yaw_zero_deg: 218.2598876953125
    imu_gyro_bias_dps: [0.0, 0.0, 0.0]
