# =============================================================================
# laser_filters 滤波链配置
# =============================================================================
# 作用：订阅雷达原始数据 /scan，按顺序经过下面 5 个滤波器，发布 /scan_filtered。
#       RViz 与 slam_toolbox 订阅过滤后的这一份。
#
# 节点 scan_to_scan_filter_chain 默认话题就是 scan -> scan_filtered，
# 在根命名空间下即 /scan -> /scan_filtered，无需重映射。
#
# ⚠️ 本配置必须在 launch 里传给【名字为 scan_to_scan_filter_chain】的节点：
#    下面的顶层 key 就是节点名，对不上参数不会被加载（表现为滤波全部无效）。
#
# ⚠️ filter1/filter2/... 按编号顺序依次作用，顺序会影响结果。
#    当前顺序：角度 -> 距离 -> 车体 -> 阴影 -> 噪点
#    即先做"范围性"裁剪，再做"邻域性"分析（阴影/噪点都依赖相邻点关系，
#    放在后面才不会把已经该删的点算进邻域统计）。
#
# 实测本机扫描特性（调参依据）：
#   430 束/帧，约 358 束有回波，距离 0.80~7.15 m，中位数 4.05 m
#   0.5m 内无点、8m 外无点 —— 车体不在扫描平面内
# =============================================================================

scan_to_scan_filter_chain:
  ros__parameters:

    # -------------------------------------------------------------------------
    # 1) 角度边界 —— 当前是 360°，等于【不过滤】
    # -------------------------------------------------------------------------
    # ⚠️ 该插件的工作方式是"把数组裁剪到 [lower, upper] 这个连续区间"。
    #    雷达本身扫描范围就是 -180°~+180°，所以设成全域时一个点都不砍，
    #    是纯直通。保留它只是作为随时可启用的开关。
    #
    # 想重新启用角度裁剪（比如砍掉正后方）就缩小这两个值：
    #   前方 270°（砍后方 90°）: -2.3562 / 2.3562
    #   前方 180°:               -1.5708 / 1.5708
    # 注意：它只能"保留一段连续范围"，不能"砍掉中间一块保留其余"；
    # 要做后者请用 laser_filters/LaserScanSectorFilter
    # （参数 angle_min/angle_max/range_min/range_max/clear_inside/invert）。
    filter1:
      name: angle
      type: laser_filters/LaserScanAngularBoundsFilter
      params:
        lower_angle: -3.1416
        upper_angle: 3.1416

    # -------------------------------------------------------------------------
    # 2) 距离截断 —— 丢掉过近与过远
    # -------------------------------------------------------------------------
    # 过近的点通常是车体自身/支架的杂散回波；过远的点多为噪声。
    # 被丢掉的点替换为 inf（表示"无回波"），下游会忽略，等价于删除。
    #
    # 当前值 0.15~10.0 m。下限按"底盘内切半径"取，上限略小于雷达量程 12m。
    filter2:
      name: range
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false   # true 则改用消息里的 range_min/max
        lower_threshold: 0.15
        upper_threshold: 10.0
        lower_replacement_value: .inf
        upper_replacement_value: .inf

    # -------------------------------------------------------------------------
    # 3) 车体轮廓剔除
    # -------------------------------------------------------------------------
    # 删掉以雷达为圆心、inscribed_radius 以内的点（即机器人自身）。
    #
    # ⚠️ 实测本机底盘【不在扫描平面内】（雷达装在底盘顶面上方，扫描面高于底盘），
    #    当前扫描 0.5m 内没有任何点，所以这个滤波器实际不删东西 —— 属于保险措施。
    #
    # ⚠️ 半径不要设大：设成 0.25（底盘对角半径）会把机器人贴近墙壁时
    #    <25cm 的合法障碍一起删掉。这里取 0.15 = 底盘半宽（内切半径）。
    filter3:
      name: footprint
      type: laser_filters/LaserScanFootprintFilter
      params:
        inscribed_radius: 0.15

    # -------------------------------------------------------------------------
    # 4) 阴影虚点 —— 对建图质量影响最大的一个
    # -------------------------------------------------------------------------
    # 激光束以很小入射角掠过障碍物边缘时，会产生"看起来在障碍物背后"的
    # 假回波。这些鬼影点会直接污染 SLAM 的扫描匹配，导致地图重影。
    #
    # 参数是【角度】不是弧度（与 filter1 不同，注意区分）：
    #   min_angle/max_angle: 判定为阴影的相邻点夹角区间
    #   neighbors: 参与判断的相邻点个数
    #   window:    邻域窗口
    #   remove_shadow_start_point: 是否连同阴影起始点一起删除
    filter4:
      name: shadows
      type: laser_filters/ScanShadowsFilter
      params:
        min_angle: 10.0
        max_angle: 170.0
        neighbors: 2
        window: 1
        remove_shadow_start_point: true

    # -------------------------------------------------------------------------
    # 5) 孤立噪点（散斑）
    # -------------------------------------------------------------------------
    # filter_type:
    #   0 = 按相邻点距离判断（距离突变视为噪点）
    #   1 = 按欧氏半径离群点搜索（更慢但更彻底）
    # max_range: 只处理这个距离以内的点（更远的不管）
    # max_range_difference: 相邻点允许的最大距离差
    # filter_window: 参与判断的相邻点个数
    filter5:
      name: speckle
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 0
        max_range: 10.0
        max_range_difference: 0.1
        filter_window: 2
