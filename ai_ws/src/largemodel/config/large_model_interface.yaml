CUID: 'IN7dAbz1thDJKVhLdypkpB6sDVG86xeG'         # Device identifier / 设备标识
PER: 0  # Speaker: Basic voices (0=Du Xiaomei, 1=Du Xiaoyu, 3=Du Xiaoyao, 4=Du Yaya) / 发音人：基础音库(0=度小美, 1=度小宇, 3=度逍遥, 4=度丫丫)
