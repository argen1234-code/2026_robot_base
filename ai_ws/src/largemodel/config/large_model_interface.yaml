oline_asr_sample_rate: 16000      # ASR audio sample rate / ASR音频采样率

## 离线语音识别 (Offline ASR)
local_asr_model: "/root/yahboom_ws/src/largemodel/MODELS/asr/SenseVoiceSmall"  # Local ASR model path / 本地ASR模型路径



