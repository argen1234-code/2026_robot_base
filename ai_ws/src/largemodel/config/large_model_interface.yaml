# =============================================================================
# 大模型接口配置文件 (Large Model Interface Configuration)
# =============================================================================

# -----------------------------------------------------------------------------
# 大模型设置 (Large Language Models Settings)
# -----------------------------------------------------------------------------

## ------------------中英文通用离线大模型配置 (Offline large model configuration for both Chinese and English)------------
# Ollama配置
ollama_host: "http://localhost:11434"  # Ollama server address / Ollama服务器地址
ollama_model: "qwen2.5:1.5b"            # Default Ollama text model / 默认Ollama文本模型

# -----------------------------------------------------------------------------
# 人设 (Persona)
# 只影响 response 字段的语气和自我介绍，不改变 JSON 格式与工具调用规则。
# -----------------------------------------------------------------------------
persona_zh: "你的人设：你是用户的智能垃圾桶管家，名字叫“小亚”。你负责响应召唤、移动到用户身边、接收垃圾并完成导航任务。回答要简洁、亲切、可靠；被问到身份时，回答“我是你的智能垃圾桶管家小亚”。"
persona_en: "Persona: You are the user's smart trash-bin butler, named Xiaoya. You respond to summons, move to the user, receive trash, and handle navigation tasks. Keep replies concise, friendly, and reliable. If asked who you are, say: 'I am your smart trash-bin butler, Xiaoya.'"

# -----------------------------------------------------------------------------
# 独立视觉模型 (Separate vision model)
# vision_platform 留空则视觉沿用 llm_platform；填 "ollama" 时视觉单独走本地
# Ollama，文本 LLM 仍可使用 DeepSeek 等在线平台。
# -----------------------------------------------------------------------------
vision_platform: "tongyi"               # "ollama" | "tongyi" | "qianfan" | "openrouter" | "deepseek" | ""
ollama_vision_model: "qwen2.5vl:3b"     # Local Qwen2.5-VL model for image/video understanding
ollama_vision_num_ctx: 2048              # Lower context reduces KV-cache memory on 8GB Pi 5
ollama_vision_keep_alive: 0              # 0 = unload immediately after each vision request



## ------------------中文在线大模型 (Chinese online large model configuration)-----------
# 通义千问平台配置 (Tongyi Platform Configuration)
tongyi_api_key: ""  # API Key / API密钥
tongyi_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # API Endpoint (no modification needed) / 接口地址(无需修改)
tongyi_model: "qwen-vl-max"  # Model to use, e.g., "qwen-vl-max", "qwen-turbo" / 使用的模型，例如 "qwen-vl-max", "qwen-turbo"
tongyi_media_model: "wanx-v1"  # Tongyi text-to-image model / 通义千问文生图模型

# 讯飞星火平台配置 (iFlytek Spark Platform Configuration)
spark_app_id: ""
spark_api_key: ""
spark_api_secret: ""
spark_model: "lite"  # Model version (domain) to use, e.g., "generalv3.5" / 使用的模型版本(domain)，例如 "generalv3.5"
spark_model_url: "wss://spark-api.xf-yun.com/v1.1/chat" # URL for Spark v3.5 / Spark v3.5 的URL

# 百度千帆平台配置 (Baidu Qianfan Platform Configuration)
qianfan_api_key: "" # Please fill in your API Key here / 请在此处填入您的API Key
qianfan_base_url: "https://qianfan.baidubce.com/v2" # Official OpenAI-compatible endpoint URL / 官方指定的OpenAI兼容接口地址
qianfan_model: "ernie-3.5-8k" # Model to use, e.g., "ERNIE-Bot-4", "ERNIE-ViL-4.0" / 使用的模型，例如 "ERNIE-Bot-4", "ERNIE-ViL-4.0"



## -----------------英文在线大模型 (English online large model configuration)-----------
# OpenRouter平台配置 (OpenRouter Platform Configuration)
openrouter_api_key: ""
openrouter_model: "qwen/qwen2.5-vl-72b-instruct:free" # Model to use, e.g., "google/gemini-pro-vision" / 使用的模型，例如 "google/gemini-pro-vision"
## DeepSeek配置 (DeepSeek Configuration)
deepseek_api_key: ""
deepseek_base_url: "https://api.deepseek.com"
deepseek_model: "deepseek-flash"




